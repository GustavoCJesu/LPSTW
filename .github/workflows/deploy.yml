# Coloque este arquivo em: .github/workflows/deploy.yml
# A cada push na branch main, envia para a HostGator só os arquivos que mudaram.

name: Deploy na HostGator

on:
  push:
    branches:
      - main
  workflow_dispatch: # permite rodar manualmente pela aba "Actions" do GitHub

jobs:
  deploy:
    name: Enviar arquivos via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Sincronizar com a HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # ftps = FTP criptografado. Se der erro de conexão ou de certificado, troque para: ftp
          protocol: ftps
          security: loose
          # "./" = pasta raiz da conta FTP. Se a conta FTP abre na sua home (e não no site),
          # troque para: public_html/   (precisa terminar com barra)
          server-dir: ./
          dry-run: true
          # Arquivos que nunca vão para o servidor
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .vscode/**
